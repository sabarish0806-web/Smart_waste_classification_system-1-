services:
  - type: web
    name: smart-waste-classification
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11